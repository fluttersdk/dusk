name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ bin/

      - name: Analyze code
        run: dart analyze lib/ test/ bin/

      - name: Run tests
        run: flutter test --exclude-tags=integration

      - name: Validate publish archive
        run: dart pub publish --dry-run

  publish:
    needs: validate
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        id: extract
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for [$VERSION]; falling back to a stub." >&2
            echo "Release $VERSION. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details." > /tmp/release-notes.md
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.extract.outputs.version }}
          body_path: /tmp/release-notes.md

  # Called here rather than triggered by `release: [published]`, which is what
  # dispatch-to-registry.yml used to declare. The release above is created by
  # softprops/action-gh-release under the default GITHUB_TOKEN, and GitHub does
  # not start workflow runs from events raised by that token, so that trigger
  # could never fire. Sequencing it after github-release also keeps the registry
  # version tracking releases pub.dev has actually accepted.
  registry:
    name: Sync skill to registry
    needs: github-release
    uses: ./.github/workflows/dispatch-to-registry.yml
    secrets:
      REGISTRY_BOT_APP_ID: ${{ secrets.REGISTRY_BOT_APP_ID }}
      REGISTRY_BOT_PRIVATE_KEY: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}
