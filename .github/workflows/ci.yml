name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # The integration tests need Chrome and run by hand (CLAUDE.md, Commands).
      - name: Run tests with coverage
        run: flutter test --coverage --exclude-tags=integration --timeout=30s

      # codecov.yml and CLAUDE.md name the same 80% floor; the build fails here
      # rather than waiting for Codecov to judge the upload.
      - name: Enforce 80% line coverage floor
        run: |
          lcov_path="coverage/lcov.info"
          if [ ! -f "$lcov_path" ]; then
            echo "lcov.info missing at $lcov_path"
            exit 1
          fi
          pct=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{ if (lf==0) exit 1; printf "%.2f", (lh/lf)*100 }' "$lcov_path")
          echo "Line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 80.0) { print "FAIL: coverage below 80% floor"; exit 1 } else { print "PASS: coverage at or above 80% floor" } }'

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
