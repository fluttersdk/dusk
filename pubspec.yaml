name: tapir
description: "Drive a live Flutter app from an AI agent or CI: Semantics snapshots, gated taps and typing, screenshots, perf traces. No flutter_test harness, no test file between actions."
version: 0.0.23
homepage: https://anilcancakir.com/tapir
repository: https://github.com/anilcancakir/tapir
issue_tracker: https://github.com/anilcancakir/tapir/issues

# pub.dev search topics: at most 5, each an existing topic. No `flutter`: pub.dev
# derives the Flutter tag from the SDK dependency.
topics:
  - mcp-server
  - e2e-testing
  - ai-agents
  - testing
  - automation

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dowel: ^0.0.21
  image: ^4.0.0
  meta: ^1.16.0
  wind_kit_diagnostics_contracts: ^1.3.0
  yaml: ^3.1.0

executables:
  # `dart run tapir <cmd>`: the Flutter-free dowel wrapper with TapirDowelProvider
  # registered, so the tapir:* commands and `mcp:serve` work without a scaffold.
  tapir: tapir

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
