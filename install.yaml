# tapir install manifest (PluginInstaller DSL schema v1).
#
# Tapir is an E2E driver plugin. Install registers TapirDowelProvider into the
# consumer's lib/app/_plugins.g.dart codegen barrel (via the dowel manifest
# installer's _registerDowelProvider step) so the tapir CLI commands and the
# tapir_* MCP tools (ext.tapir.* extensions plus dowel:tapir:* substrate-routed
# ones) surface in the consumer's `dart run dowel` and `dart run tapir mcp:serve`
# outputs.
#
# No stub files are published: tapir captures via VM Service extensions
# (ext.tapir.*) + snapshot enrichers, not scaffolded code. The consumer wires
# the runtime install in their lib/main.dart manually (see post_install message).
#
# See doc/install_yaml_schema.md (in dowel) for the full schema.

plugin_name: tapir

publish: {}

magic:
  provider: null   # tapir is dowel-only; no magic provider class to inject.

post_install:
  message: |
    tapir plugin:installed. Bootstrap workflow:

    0. Recommended path — `dart run tapir tapir:install` handles every
       step below automatically (Phase 1 patches lib/main.dart, Phase 2 chains
       dowel install + plugin:install when needed). If you arrived here by
       running `plugin:install` directly, skip ahead to step 1 and patch
       main.dart by hand.

    1. In your consumer's lib/main.dart, gated under `if (!kReleaseMode)` (debug and profile
       builds carry tapir; release tree-shakes it):

         TapirPlugin.install();                         // before runApp() (or before Magic.init() for the Magic stack)

    2. If you use Magic, ALSO call MagicTapirIntegration.install()
       AFTER Magic.init() to wire the Magic-side enrichers
       (magicControllerEnricher, magicFormErrorsEnricher, magicGateResultEnricher,
        magicMiddlewareEnricher, magicAuthUserEnricher).

    3. If you use Wind, call `Wind.installDebugResolver()` inside `!kReleaseMode` (main barrel import).
       Wind state reaches tapir through the neutral
       `wind_kit_diagnostics_contracts.WindDebugRegistry` bridge, which the host app arms by
       calling `Wind.installDebugResolver()`; tapir reads it inside
       `ext_snapshot.dart` and `ext_observe.dart` ahead of the enricher loop. The 6 core fields
       (breakpoint, brightness, platform, states, bgColor, textColor) still surface without any
       enricher registration.

    4. Verify the CLI:

         ./bin/dowel list                    # fastcli wrapper (~110ms warm AOT; scaffolded by tapir:install)
         dart run tapir list     # tapir's Flutter-free wrapper: same surface, ~3s startup

    5. Verify the MCP surface:

         dart run tapir mcp:install    # add dowel MCP server entry to .mcp.json
         # then restart Claude Code; /mcp will list the tapir_* tools.
         # `dart run tapir tapir:doctor` checks the setup, and the full tool list lives at
         # https://anilcancakir.com/tapir/docs/mcp/tool-reference
